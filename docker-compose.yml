services:
  filebrowser:
    # Pinned via .env so upstream updates never change behavior unannounced
    image: filebrowser/filebrowser:${FB_VERSION:?pin FB_VERSION in .env}
    container_name: filebrowser

    # Run as the same UID:GID as qBittorrent so both can read/write the same files
    user: "${PUID:?set PUID in .env}:${PGID:?set PGID in .env}"

    ports:
      # 8080 is taken by the qBittorrent Web UI
      - "${FB_PORT:-8081}:80"

    environment:
      - TZ=${TZ:-UTC}

    volumes:
      # FileBrowser's settings and user database (persist across restarts)
      - ${FB_CONFIG_PATH:-./config}:/config
      - ${FB_DATABASE_PATH:-./database}:/database

      # Only the qBittorrent downloads folder is exposed, never the whole host
      - ${DOWNLOADS_PATH:?DOWNLOADS_PATH must be set in .env}:/srv/downloads:rw

    restart: unless-stopped
